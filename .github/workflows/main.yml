name: Compilar mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descomprimir el mod (si subiste el .zip o .rar)
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -n 1)" ]; then
            find . -maxdepth 2 -type f \( -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' \) -not -path './.git/*' -print0 |
              while IFS= read -r -d '' archivo; do
                echo "Descomprimiendo: $archivo"
                case "${archivo,,}" in
                  *.zip) unzip -q -o "$archivo" -d _mod ;;
                  *) 7z x -y -o_mod "$archivo" > /dev/null ;;
                esac
              done
          fi

      - name: Buscar la carpeta del mod
        id: proyecto
        run: |
          ARCHIVO=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$ARCHIVO" ]; then
            echo "::error::No encuentro settings.gradle en el repositorio. Estos son los archivos subidos:"
            find . -not -path './.git*' | sort | head -n 300
            exit 1
          fi
          RUTA=$(dirname "$ARCHIVO")
          echo "El mod esta en: $RUTA"
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compilar el mod
        working-directory: ${{ steps.proyecto.outputs.ruta }}
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: saltalandia-mod
          path: ${{ steps.proyecto.outputs.ruta }}/build/libs/*.jar
          if-no-files-found: error
